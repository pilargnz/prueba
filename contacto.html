<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto - Pop Art</title>
  <link rel="stylesheet" href="estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-artistas"></div>
  <header class="menu-fijo con-textura">
    <img src="imagenes/logopopart.png" alt="Logo Pop Art" class="logo">
    <nav class="menu-principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="artistas.html">Artistas</a></li>
        <li><a href="obras.html">Obras</a></li>
        <li><a href="galeria.html">Galería</a></li>
        <li><a href="recursos.html">Recursos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="contacto-main">
    <h1>¡Contáctanos!</h1>
    <p>¿Querés saber más sobre el Pop Art o colaborar con nosotros? ¡Escribinos!</p>

    <div class="contacto-contenedor">
      <form class="formulario-contacto" action="#" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar</button>
      </form>

      <img src="imagenes/contactoimg.jpeg" alt="Ilustración Pop Art" class="imagen-contacto">
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 Galería Pop Art. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
